name: Sync latest component tags

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-latest-component-tags
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Select newest stable tags and update README
        run: python ci/sync_latest_tags.py
      - name: Open or update a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo 'No changes to component references.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b codex/latest-component-tags
          git commit -m 'chore: sync library submodules to latest stable tags'
          git fetch origin refs/heads/codex/latest-component-tags:refs/remotes/origin/codex/latest-component-tags || true
          git push --force-with-lease origin HEAD:refs/heads/codex/latest-component-tags
          number=$(gh pr list --head codex/latest-component-tags --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create --draft --base "${{ github.event.repository.default_branch }}" \
              --head codex/latest-component-tags \
              --title 'chore: sync library submodules to latest stable tags' \
              --body 'Fast-forward candidates from the highest numeric non-prerelease tags. Newer development commits and divergent histories are preserved. Verify Release records, mirrors, API compatibility and CI before merging; the GitHub Actions token does not trigger CI on its own PR.'
          else
            echo "Updated existing pull request #$number"
          fi
